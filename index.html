<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS Nutrition Center – Product Price List</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--text:#1d2a1f;--muted:#66756a;--line:#e1e8e2;--accent:#2e7d32;--head:#2e7d32;--headtext:#fff;--hl:#e8f5e9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101611;--card:#18211a;--text:#e6efe7;--muted:#93a597;--line:#2a372c;--accent:#66bb6a;--head:#1f4d23;--headtext:#e6efe7;--hl:#1f3322}}
:root[data-theme="dark"]{--bg:#101611;--card:#18211a;--text:#e6efe7;--muted:#93a597;--line:#2a372c;--accent:#66bb6a;--head:#1f4d23;--headtext:#e6efe7;--hl:#1f3322}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
input{flex:1;min-width:180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{background:var(--head);color:var(--headtext);position:sticky;top:0;font-weight:600;cursor:pointer;user-select:none}
tbody tr{border-top:1px solid var(--line)}
tbody tr:hover{background:var(--hl)}
td.hl,th.hl{background:var(--hl)}
thead th.hl{background:var(--accent);color:#fff}
.n{color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:.8rem;margin-top:10px}
</style></head><body><div class="wrap">
<h1>GS Nutrition Center</h1>
<p class="sub">Product Price List · prices in ₹</p>
<div class="bar">
<input id="q" type="search" placeholder="Search product…" aria-label="Search product">
<select id="hl" aria-label="Highlight discount column"><option value="-1">Highlight: none</option><option value="3">13%</option><option value="4">25%</option><option value="5">35%</option><option value="6">42%</option><option value="7">50%</option></select>
</div>
<div class="card"><div class="scroll"><table>
<thead><tr><th data-k="0">Product</th><th data-k="1">VP</th><th data-k="2">MRP</th><th data-k="3">13%</th><th data-k="4">25%</th><th data-k="5">35%</th><th data-k="6">42%</th><th data-k="7">50%</th></tr></thead>
<tbody id="b"></tbody></table></div><div class="empty" id="e" hidden>No products found</div></div>
<p class="foot">VP = Volume Points. Tap a column heading to sort.</p>
</div>
<script>
const D=[["F1 (Small)", 21.75, 2179, 1899, 1713, 1526, 1396, 1246], ["F1 (Big)", 32.65, 3227, 2813, 2537, 2261, 2068, 1847], ["PPP (Small)", 11.5, 1295, 1129, 1018, 907, 830, 741], ["PPP (BIG)", 22.5, 2485, 2166, 1953, 1741, 1592, 1422], ["ShakeMate", 6.45, 653, 604, 572, 540, 517, 491], ["Afresh", 7.8, 812, 712, 646, 580, 534, 481], ["M.V", 19.95, 2004, 1746, 1575, 1404, 1284, 1147], ["Fiber", 15.75, 1636, 1426, 1286, 1146, 1048, 936], ["C.U.L", 15.75, 1705, 1486, 1340, 1194, 1092, 975], ["C.A", 21.95, 2215, 1930, 1741, 1551, 1419, 1267], ["A.P", 9.4, 1059, 922, 832, 741, 678, 605], ["Calcium", 10.25, 1203, 1048, 945, 842, 771, 688], ["J.S", 20.9, 2455, 2140, 1930, 1720, 1573, 1405], ["Herbalifeline", 25.75, 2667, 2325, 2097, 1869, 1709, 1527], ["Herbal Control", 32.95, 3433, 2992, 2699, 2405, 2199, 1965], ["Ocular Defense", 19.25, 1927, 1679, 1515, 1350, 1234, 1103], ["Male Factor +", 34.75, 3410, 2972, 2681, 2389, 2185, 1952], ["Woman’s Choice", 12.45, 1245, 1085, 978, 872, 798, 712], ["Skin Booster", 38.65, 3910, 3476, 3188, 2899, 2697, 2466], ["DinoShake", 9.6, 1115, 971, 876, 780, 714, 637], ["Herbal Aloe Concentrate", 24.95, 2696, 2350, 2119, 1889, 1727, 1543], ["Niteworks", 75, 7128, 6213, 5604, 4994, 4568, 4080], ["Beta Heart", 19.55, 2242, 1994, 1828, 1663, 1547, 1414], ["AFC", 22.95, 2559, 2231, 2012, 1793, 1640, 1465], ["H24 Hydrate", 14.05, 1636, 1457, 1338, 1219, 1136, 1041], ["H24 Rebuild Strength - 50 gms x 10 Sachets", 24.7, 2616, 2295, 2081, 1868, 1718, 1547], ["Liftoff Big", 38.05, 4119, 3590, 3238, 2886, 2639, 2357], ["Liftoff Small", 12.95, 1401, 1221, 1101, 982, 898, 802], ["Simply Probiotic", 21.95, 2209, 1925, 1736, 1547, 1415, 1264], ["Sleep Enhance", 16.3, 1697, 1479, 1334, 1189, 1087, 971], ["Brain Health", 15.1, 1464, 1276, 1151, 1026, 938, 838], ["Immune Health", 15.8, 1528, 1332, 1201, 1070, 979, 874], ["Triphala", 11.25, 1089, 949, 856, 763, 698, 623], ["Cleanser", 10.4, 1165, 1015, 916, 816, 746, 667], ["Toner", 11.8, 1322, 1152, 1039, 926, 847, 756], ["Serum", 27.05, 3022, 2634, 2376, 2118, 1937, 1730], ["Moisturizer", 13.15, 1473, 1284, 1158, 1032, 944, 843], ["Shaker Cup", 0, 400, 400, 400, 400, 400, 400], ["Coupon", 0, 500, 500, 500, 500, 500, 500], ["Small Tablet Box", 0, 100, 100, 100, 100, 100, 100], ["Big Tablet Box", 0, 200, 200, 200, 200, 200, 200], ["Delivery Charge", null, 120, 120, 120, 120, 120, 120]];
let sk=-1,asc=true,hl=-1;
const f=v=>Number(v).toLocaleString('en-IN');
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  let r=D.filter(x=>x[0].toLowerCase().includes(q));
  if(sk>=0)r=[...r].sort((a,b)=>(sk?(a[sk]-b[sk]):a[0].localeCompare(b[0]))*(asc?1:-1));
  document.getElementById('b').innerHTML=r.map(x=>'<tr><td>'+x[0]+'</td><td class="'+(x[1]?'':'n')+(hl==1?' hl':'')+'">'+(x[1]?x[1]:'–')+'</td>'+
    x.slice(2).map((v,i)=>'<td'+(hl==i+2?' class="hl"':'')+'>₹'+f(v)+'</td>').join('')+'</tr>').join('');
  document.getElementById('e').hidden=r.length>0;
  document.querySelectorAll('th').forEach((t,i)=>t.classList.toggle('hl',i==hl));
}
document.getElementById('q').oninput=render;
document.getElementById('hl').onchange=e=>{hl=+e.target.value;render()};
document.querySelectorAll('th').forEach(t=>t.onclick=()=>{const k=+t.dataset.k;asc=sk==k?!asc:true;sk=k;render()});
render();
</script></body></html>
